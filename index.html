<!doctype html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Design — אדריכלות ועיצוב פנים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Heebo:wght@300;400;500;600;700&family=Outfit:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="overlay-card.css">
</head>

<body>
  <header class="site-header">
    <a class="brand" href="#" aria-label="My Design דף הבית">
      <svg class="brand__mark" viewBox="0 0 42 42" aria-hidden="true">
        <path d="M5 32.5V17.75L21 7l16 10.75V32.5" />
        <path d="M21 7V17" />
        <path d="M13 34V22.5L21 17l8 5.5V34" />
      </svg>
      <span class="brand__name">My Design</span>
    </a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation"
      aria-label="פתח תפריט ניווט">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav id="primary-navigation" class="site-nav" aria-label="ניווט ראשי">
      <a class="site-nav__link" href="#projects">
        <span>פרויקטים</span>
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" />
        </svg>
      </a>
      <a class="site-nav__link site-nav__link--primary" href="#overlay-card" data-scroll-overlay="overlay-card">
        <span>צרו קשר</span>
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" />
        </svg>
      </a>
    </nav>
  </header>

  <main>
    <section id="projects" class="sequence" aria-label="רצף תמונות מונחה גלילה">
      <div class="sequence__stage">
        <canvas class="sequence__canvas" aria-hidden="true"></canvas>

        <!--
          Frame overlays: timing lives in OVERLAY_FRAMES (script.js).
          Give each .overlay a unique id that matches a key there.
        -->
        <div class="sequence__overlays" aria-live="polite">
          <div class="overlay" id="overlay-lets-go" aria-hidden="true">
            <button class="floating-cta" type="button" aria-label="התחל את הסיור">
              <span>כנסו לסיור</span>
              <span class="floating-cta__icon" aria-hidden="true">
                <svg viewBox="0 0 18 18">
                  <path d="M3 9h12M10 4l5 5-5 5" />
                </svg>
              </span>
            </button>
          </div>

          <div class="overlay" id="overlay-card" aria-hidden="true">
            <div class="card">
              <header class="logo-section">
                <div class="logo-mark" aria-hidden="true"></div>
              </header>

              <section class="contact-section">
                <h2>צרו קשר</h2>
                <ul class="contact-list">
                  <li class="contact-row-phones">
                    <span class="contact-icon phone" aria-hidden="true"></span>
                    <div class="contact-phones-inline">
                      <div>
                        <div class="contact-label">מילנה</div>
                        <div class="contact-value"><a href="tel:+972526162323">052-616-2323</a></div>
                      </div>
                      <div>
                        <div class="contact-label">יוליה</div>
                        <div class="contact-value"><a href="tel:+972524490308">052-449-0308</a></div>
                      </div>
                    </div>
                  </li>
                  <li>
                    <span class="contact-icon email" aria-hidden="true"></span>
                    <div>
                      <div class="contact-label">אימייל</div>
                      <div class="contact-value"><a href="mailto:mydisign29@gmail.com">mydisign29@gmail.com</a></div>
                    </div>
                  </li>
                  <li class="contact-row-phones">
                    <span class="contact-icon whatsapp" aria-hidden="true"></span>
                    <div class="contact-phones-wrap">
                      <div class="contact-label">ווטסאפ</div>
                      <div class="contact-phones-inline">
                        <div>
                          <div class="contact-value">
                            <a class="contact-wa-link" href="https://wa.me/972526162323" target="_blank" rel="noopener"
                              aria-label="שלח הודעה בוווטסאפ למילנה">
                              <span class="contact-wa-link-icon" aria-hidden="true"></span>
                              מילנה
                            </a>
                          </div>
                        </div>
                        <div>
                          <div class="contact-value">
                            <a class="contact-wa-link" href="https://wa.me/972524490308" target="_blank" rel="noopener"
                              aria-label="שלח הודעה בוווטסאפ ליוליה">
                              <span class="contact-wa-link-icon" aria-hidden="true"></span>
                              יוליה
                            </a>
                          </div>
                        </div>
                      </div>
                    </div>
                  </li>
                </ul>
              </section>
            </div>
          </div>
        </div>

        <div class="sequence__loader" role="status" aria-live="polite">
          <span class="sequence__spinner" aria-hidden="true"></span>
          <span class="sequence__status">טוען פריימים… 0%</span>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
