<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Design — Architecture & Interiors</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="My Design home">
        <svg class="brand__mark" viewBox="0 0 42 42" aria-hidden="true">
          <path d="M5 32.5V17.75L21 7l16 10.75V32.5"/>
          <path d="M13 34V22.5L21 17l8 5.5V34"/>
        </svg>
        <span class="brand__name">My Design</span>
        <span class="brand__descriptor">Architecture</span>
      </a>

      <button
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="primary-navigation"
        aria-label="Open navigation menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav id="primary-navigation" class="site-nav" aria-label="Primary navigation">
        <a class="site-nav__link" href="#projects">
          <span>Projects</span>
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 8h10M9 4l4 4-4 4"/>
          </svg>
        </a>
        <a class="site-nav__link site-nav__link--primary" href="#contact">
          <span>Contact us</span>
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 8h10M9 4l4 4-4 4"/>
          </svg>
        </a>
      </nav>
    </header>

    <main>
      <section id="projects" class="sequence" aria-label="Scroll-controlled image sequence">
        <div class="sequence__stage">
          <canvas class="sequence__canvas" aria-hidden="true"></canvas>
          <div class="sequence__loader" role="status" aria-live="polite">
            <span class="sequence__spinner" aria-hidden="true"></span>
            <span class="sequence__status">Loading frames… 0%</span>
          </div>
        </div>
      </section>
    </main>

    <button class="floating-cta" type="button" aria-label="Start the tour">
      <span>Let's go</span>
      <span class="floating-cta__icon" aria-hidden="true">
        <svg viewBox="0 0 18 18">
          <path d="M3 9h12M10 4l5 5-5 5"/>
        </svg>
      </span>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
